name: Offline e2e
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-e2e:
    runs-on: ubuntu-24.04 # pinned: Playwright does not support the newer ubuntu-latest image yet
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Offline e2e (the saved app opens cold with no connection, the connection pill, the checklist)
        # No model is downloaded here. tests/e2e/offline-model.e2e.mjs, the full lifecycle with a real model, is a release check (docs/OPERATIONS.md).
        run: |
          node tests/e2e/offline.e2e.mjs
          node tests/e2e/offline-variants.e2e.mjs
