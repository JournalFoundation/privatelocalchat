name: Voice e2e
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voice-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  voice-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Cache the voice model files
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/plc-voice-e2e
          key: voice-e2e-files-${{ hashFiles('chat/voice-manifest.mjs', 'chat/voice-manifest-kokoro.mjs') }}
      - name: Voice e2e tests
        # tests/e2e/voice-files.mjs downloads the pinned model files from the CDN into $TMPDIR/plc-voice-e2e and verifies every SHA-256
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          for f in voice-engine voice-kokoro voice-offline voice-storage voice-measure; do
            echo "::group::$f"
            node "tests/e2e/$f.e2e.mjs"
            echo "::endgroup::"
          done
